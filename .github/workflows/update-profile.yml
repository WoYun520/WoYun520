name: Refresh profile

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/render_profile.py
      - assets/avatar.txt
      - .github/workflows/update-profile.yml
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_profile.py --update
      - name: Commit updated card
        run: |
          if ! git diff --quiet -- profile.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add profile.svg
            git commit -m 'Update profile card'
            git push
          fi
